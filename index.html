<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Clube dos Tenistas da Bahia</title>

    <!-- Configuração para o WhatsApp / Redes Sociais -->
    <meta property="og:title" content="Cadastro de Atletas - CTB" />
    <meta property="og:description" content="Faça seu cadastro de associado no Clube dos Tenistas da Bahia. Válido para Tênis de Mesa, Tênis de Quadra e Beach Tennis." />
    <meta property="og:image" content="https://pfeira.github.io/cadastro-ctb/logoctb-alta.png" />
    <meta property="og:url" content="https://pfeira.github.io/cadastro-ctb/" />
    <meta property="og:type" content="website" />

    <!-- Configuração para o Web App (Instalação no Celular) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2BA02D">
    <link rel="apple-touch-icon" href="logoctb-alta.png">

    <!-- Tailwind CSS para o visual moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonte Montserrat (Oficial do Manual CTB) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Configuração das Cores do Manual CTB -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ctbGreenLight: '#C3FE4D',
                        ctbGreenDark: '#2BA02D',
                        ctbNavy: '#19305A',
                    },
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen text-ctbNavy font-sans flex items-center justify-center p-4">

    <div class="bg-white max-w-lg w-full rounded-2xl shadow-xl overflow-hidden transform transition-all duration-300 hover:shadow-2xl">
        <!-- Cabeçalho -->
        <div class="bg-ctbNavy p-6 text-center rounded-b-3xl shadow-md">
            <img src="logoctb-alta.png" alt="Logomarca CTB" class="mx-auto h-28 object-contain mb-4 drop-shadow-md transition-transform duration-300 hover:scale-105">
            <h1 class="text-2xl font-extrabold text-white">Cadastro de Associado</h1>
            <p class="text-ctbGreenLight mt-1 font-semibold text-sm">Junte-se à nossa equipa</p>
        </div>

        <!-- Formulário integrado ao FormSubmit -->
        <form id="cadastroForm" action="https://formsubmit.co/pfeira@gmail.com" method="POST" class="p-6 space-y-6">
            
            <!-- Configurações Ocultas do FormSubmit -->
            <input type="hidden" name="_subject" value="Novo Cadastro de Atleta - CTB">
            <input type="hidden" name="_template" value="table">
            <!-- Redireciona o atleta de volta para o app após o envio -->
            <input type="hidden" name="_next" value="https://pfeira.github.io/cadastro-ctb/">

            <!-- Modalidade Esportiva -->
            <div>
                <label class="block text-sm font-bold text-ctbNavy mb-2"><i class="fa-solid fa-medal mr-2 text-ctbGreenDark"></i>Modalidade Principal</label>
                <select name="modalidade" id="modalidade" required class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-ctbGreenDark focus:border-transparent outline-none transition-all shadow-sm appearance-none bg-gray-50">
                    <option value="" disabled selected>Selecione o seu desporto...</option>
                    <option value="Tênis de Mesa">Tênis de Mesa</option>
                    <option value="Tênis de Quadra">Tênis de Quadra</option>
                    <option value="Beach Tennis">Beach Tennis</option>
                </select>
            </div>

            <!-- Nome Completo -->
            <div>
                <label class="block text-sm font-bold text-ctbNavy mb-2"><i class="fa-solid fa-user mr-2 text-ctbGreenDark"></i>Nome Completo</label>
                <input type="text" name="nome" id="nome" required placeholder="Digite o seu nome completo" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-ctbGreenDark focus:border-transparent outline-none transition-all shadow-sm bg-gray-50">
            </div>

            <!-- E-mail e WhatsApp (Novos Campos) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-ctbNavy mb-2"><i class="fa-solid fa-envelope mr-2 text-ctbGreenDark"></i>E-mail</label>
                    <input type="email" name="email" id="email" required placeholder="seu.email@exemplo.com" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-ctbGreenDark focus:border-transparent outline-none transition-all shadow-sm bg-gray-50">
                </div>
                <div>
                    <label class="block text-sm font-bold text-ctbNavy mb-2"><i class="fa-brands fa-whatsapp mr-2 text-ctbGreenDark"></i>WhatsApp</label>
                    <input type="tel" name="whatsapp" id="whatsapp" required placeholder="(71) 99999-9999" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-ctbGreenDark focus:border-transparent outline-none transition-all shadow-sm bg-gray-50">
                </div>
            </div>

            <!-- Data de Nascimento -->
            <div>
                <label class="block text-sm font-bold text-ctbNavy mb-2"><i class="fa-solid fa-calendar-days mr-2 text-ctbGreenDark"></i>Data de Nascimento</label>
                <input type="date" name="nascimento" id="nascimento" required class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-ctbGreenDark focus:border-transparent outline-none transition-all shadow-sm bg-gray-50 text-gray-700">
            </div>

            <!-- Tamanho da Camisa -->
            <div>
                <label class="block text-sm font-bold text-ctbNavy mb-2"><i class="fa-solid fa-shirt mr-2 text-ctbGreenDark"></i>Tamanho da Camisa</label>
                <div class="grid grid-cols-3 md:grid-cols-6 gap-2">
                    <div>
                        <input type="radio" id="camisaPP" name="camisa" value="PP" class="hidden peer" required>
                        <label for="camisaPP" class="flex items-center justify-center w-full h-12 border-2 border-gray-200 rounded-lg cursor-pointer font-bold text-gray-500 hover:bg-gray-50 peer-checked:bg-ctbNavy peer-checked:text-ctbGreenLight peer-checked:border-ctbNavy transition-all">PP</label>
                    </div>
                    <div>
                        <input type="radio" id="camisaP" name="camisa" value="P" class="hidden peer">
                        <label for="camisaP" class="flex items-center justify-center w-full h-12 border-2 border-gray-200 rounded-lg cursor-pointer font-bold text-gray-500 hover:bg-gray-50 peer-checked:bg-ctbNavy peer-checked:text-ctbGreenLight peer-checked:border-ctbNavy transition-all">P</label>
                    </div>
                    <div>
                        <input type="radio" id="camisaM" name="camisa" value="M" class="hidden peer">
                        <label for="camisaM" class="flex items-center justify-center w-full h-12 border-2 border-gray-200 rounded-lg cursor-pointer font-bold text-gray-500 hover:bg-gray-50 peer-checked:bg-ctbNavy peer-checked:text-ctbGreenLight peer-checked:border-ctbNavy transition-all">M</label>
                    </div>
                    <div>
                        <input type="radio" id="camisaG" name="camisa" value="G" class="hidden peer">
                        <label for="camisaG" class="flex items-center justify-center w-full h-12 border-2 border-gray-200 rounded-lg cursor-pointer font-bold text-gray-500 hover:bg-gray-50 peer-checked:bg-ctbNavy peer-checked:text-ctbGreenLight peer-checked:border-ctbNavy transition-all">G</label>
                    </div>
                    <div>
                        <input type="radio" id="camisaGG" name="camisa" value="GG" class="hidden peer">
                        <label for="camisaGG" class="flex items-center justify-center w-full h-12 border-2 border-gray-200 rounded-lg cursor-pointer font-bold text-gray-500 hover:bg-gray-50 peer-checked:bg-ctbNavy peer-checked:text-ctbGreenLight peer-checked:border-ctbNavy transition-all">GG</label>
                    </div>
                    <div>
                        <input type="radio" id="camisaEXG" name="camisa" value="EXG" class="hidden peer">
                        <label for="camisaEXG" class="flex items-center justify-center w-full h-12 border-2 border-gray-200 rounded-lg cursor-pointer font-bold text-gray-500 hover:bg-gray-50 peer-checked:bg-ctbNavy peer-checked:text-ctbGreenLight peer-checked:border-ctbNavy transition-all text-sm">EXG</label>
                    </div>
                </div>
            </div>

            <!-- Ranking e Rating -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-ctbNavy mb-2"><i class="fa-solid fa-trophy mr-2 text-ctbGreenDark"></i>Ranking</label>
                    <input type="text" name="ranking" id="ranking" maxlength="50" placeholder="Ex: 1º Baiano" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-ctbGreenDark focus:border-transparent outline-none transition-all shadow-sm bg-gray-50">
                    <p class="text-xs text-gray-400 mt-1">Máx. 50 caracteres</p>
                </div>
                <div>
                    <label class="block text-sm font-bold text-ctbNavy mb-2"><i class="fa-solid fa-star mr-2 text-ctbGreenDark"></i>Rating</label>
                    <input type="text" name="rating" id="rating" maxlength="50" placeholder="Ex: Classe A" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-ctbGreenDark focus:border-transparent outline-none transition-all shadow-sm bg-gray-50">
                    <p class="text-xs text-gray-400 mt-1">Máx. 50 caracteres</p>
                </div>
            </div>

            <!-- Botão Enviar -->
            <button type="submit" id="btnSubmit" class="w-full bg-ctbGreenDark hover:bg-ctbNavy text-white font-extrabold text-lg py-4 rounded-xl shadow-lg transform transition-all duration-300 hover:-translate-y-1 mt-4">
                <i class="fa-solid fa-paper-plane mr-2"></i> Enviar Cadastro
            </button>
        </form>
    </div>

    <script>
        const form = document.getElementById('cadastroForm');

        // 1. Guardar os dados localmente enquanto o atleta preenche
        form.addEventListener('input', function() {
            const formData = new FormData(form);
            const dataObj = Object.fromEntries(formData.entries());
            localStorage.setItem('cadastroCTB', JSON.stringify(dataObj));
        });

        // 2. Restaurar os dados caso a página seja fechada acidentalmente
        window.addEventListener('load', function() {
            const savedData = localStorage.getItem('cadastroCTB');
            if(savedData) {
                const dataObj = JSON.parse(savedData);
                for (const key in dataObj) {
                    const field = form.elements[key];
                    if (field) {
                        if (field.type === 'radio') {
                            const radioBtn = document.querySelector(`input[name="${key}"][value="${dataObj[key]}"]`);
                            if(radioBtn) radioBtn.checked = true;
                        } else {
                            field.value = dataObj[key];
                        }
                    }
                }
            }
        });

        // 3. Limpar a memória local apenas no momento em que o formulário for submetido
        form.addEventListener('submit', function() {
            const btnSubmit = document.getElementById('btnSubmit');
            btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> A processar...';
            localStorage.removeItem('cadastroCTB');
        });
    </script>
</body>
</html>
